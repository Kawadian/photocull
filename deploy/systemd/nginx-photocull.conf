server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # Match the names in server.allowed_hosts and keep the LAN/Tailscale IP rules.
    # Replace photocull.local with the instance's DNS name and append its LAN IP.
    if ($host !~* ^(photocull\.local|localhost|127\.0\.0\.1)$) { return 421; }

    allow 127.0.0.0/8;
    allow ::1;
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;
    deny all;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;

    # Cached files use these types even on nginx releases without AVIF in mime.types.
    types {
        image/avif avif;
        image/webp webp;
        image/jpeg jpg;
        video/mp4 mp4;
    }

    location = /_photocull {
        internal;
        return 404;
    }

    location ^~ /_photocull/ {
        internal;
        return 404;
    }

    # Enable derivatives.accel_redirect in the API only after matching these aliases.
    # In Compose, deploy/compose.browser.example.yml mounts both roots read-only here.
    location ^~ /_photocull/hot/ {
        internal;
        alias /var/lib/photocull/derivatives/hot/;
        disable_symlinks on;
        sendfile on;
        add_header Cache-Control "private, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /_photocull/large/ {
        internal;
        alias /srv/photocull-cache-hdd/;
        disable_symlinks on;
        sendfile on;
        add_header Cache-Control "private, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        set $photocull_token "";
        include /etc/nginx/photocull.d/*.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Photocull-Token $photocull_token;
        proxy_read_timeout 60s;
    }
}
