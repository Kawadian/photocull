server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    allow 127.0.0.0/8;
    allow ::1;
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;
    deny all;

    location / {
        set $photocull_token "";
        include /etc/nginx/photocull.d/*.conf;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Photocull-Token $photocull_token;
        proxy_read_timeout 60s;
    }
}
