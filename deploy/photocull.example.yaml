# Paths can be relative to the directory containing this file.
state_dir: /var/lib/photocull
bind_host: 127.0.0.1
bind_port: 8000
libraries:
  photos:
    root: /mnt/PhotoLibrary
  # linked:
  #   root: /srv/photocull-view
  #   allowed_roots: [/mnt/PhotoLibrary]
# token_file: /etc/photocull/token
# server:
#   allowed_hosts: [photocull.local, localhost, 127.0.0.1]
worker:
  memory_mb: 1536
  batch_size: 8
  parallelism: 1
  scan_parallelism: 1
  scan_batch_size: 64
  hash_read_mib: 4
  scan_overlap: false # Keep false for libraries on one spinning disk.
  stages: [exif, preview, score]
  device: cpu
