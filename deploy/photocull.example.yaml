# Paths can be relative to the directory containing this file.
state_dir: /var/lib/photocull
bind_host: 127.0.0.1
bind_port: 8000
libraries:
  photos:
    root: /mnt/PhotoLibrary
  # linked:
  #   root: /srv/photocull-view
  #   allowed_roots: [/mnt/PhotoLibrary]
# token_file: /etc/photocull/token
worker:
  memory_mb: 1536
  batch_size: 8
  parallelism: 1
  stages: [exif, preview, score]
  device: cpu
