x-photocull-config: &config
  type: bind
  source: ${PHOTOCULL_CONFIG_FILE:-./deploy/photocull.example.yaml}
  target: /etc/photocull/photocull.yaml
  read_only: true
  bind:
    create_host_path: false

x-photocull-state: &state
  type: bind
  source: ${PHOTOCULL_STATE_HOST_DIR:-./.photocull/state}
  target: /var/lib/photocull
  bind:
    create_host_path: false

x-photocull-library: &library
  type: bind
  source: ${PHOTOCULL_LIBRARY_DIR:-/mnt/PhotoLibrary}
  target: /mnt/PhotoLibrary
  read_only: true
  bind:
    create_host_path: false

x-photocull-env: &photocull-env
  PHOTOCULL_VLM_BASE_URL:
  PHOTOCULL_VLM_MODEL:
  PHOTOCULL_VLM_API_KEY:
  PHOTOCULL_SETTINGS_ENDPOINTS:
  PHOTOCULL_DERIVATIVES_ENABLED:
  PHOTOCULL_DERIVATIVES_HOT_DIR:
  PHOTOCULL_DERIVATIVES_LARGE_DIR:
  PHOTOCULL_DERIVATIVES_HOT_MIB:
  PHOTOCULL_DERIVATIVES_LARGE_MIB:
  PHOTOCULL_DERIVATIVES_PREWARM:
  PHOTOCULL_DERIVATIVES_AVIF_QUALITY:
  PHOTOCULL_DERIVATIVES_WEBP_QUALITY:
  PHOTOCULL_DERIVATIVES_JPEG_QUALITY:
  PHOTOCULL_DERIVATIVES_ORIGINAL_DOWNLOAD:
  PHOTOCULL_DERIVATIVES_ORIGINAL_STREAMING:
  PHOTOCULL_DERIVATIVES_ACCEL_REDIRECT:

services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    user: "${PHOTOCULL_UID:-1000}:${PHOTOCULL_GID:-1000}"
    network_mode: host
    restart: unless-stopped
    mem_limit: 500m
    environment:
      <<: *photocull-env
      PHOTOCULL_CONFIG: /etc/photocull/photocull.yaml
      PHOTOCULL_BROWSER_STRIP_LOCATION:
      PHOTOCULL_ALLOWED_HOSTS:
      PHOTOCULL_TOKEN_FILE:
      PHOTOCULL_SETTINGS_ROOTS:
      PHOTOCULL_WORKER_NETWORK_MODE:
      PHOTOCULL_BIND_HOST: 127.0.0.1
      PHOTOCULL_BIND_PORT: '8000'
      # Keep the connection test on the API's host network.
      HTTPS_PROXY: ""
    volumes:
      - *config
      - *state
      - *library
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 15s
      timeout: 3s
      retries: 4

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    user: "${PHOTOCULL_UID:-1000}:${PHOTOCULL_GID:-1000}"
    # Use deploy/compose.egress.yml for isolated remote decision traffic.
    network_mode: "${PHOTOCULL_WORKER_NETWORK_MODE:-none}"
    restart: unless-stopped
    stop_grace_period: 90s
    cpus: ${PHOTOCULL_WORKER_CPUS:-2.0}
    mem_limit: ${PHOTOCULL_WORKER_MEM_LIMIT:-2g}
    environment:
      <<: *photocull-env
      PHOTOCULL_CONFIG: /etc/photocull/photocull.yaml
      PHOTOCULL_BROWSER_STRIP_LOCATION:
      PHOTOCULL_MODEL_DIR: /models
      HTTPS_PROXY: ""
    volumes:
      - *config
      - *state
      - *library
      - type: bind
        source: ${PHOTOCULL_MODELS_DIR:-./.photocull/models}
        target: /models
        bind:
          create_host_path: false

  proxy:
    image: nginx:stable-alpine
    network_mode: host
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - type: bind
        source: ${PHOTOCULL_NGINX_CONFIG:-./deploy/systemd/nginx-photocull.conf}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
