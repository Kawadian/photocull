name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra worker
      - run: uv run --locked --extra worker ruff check
      - run: uv run --locked --extra worker ruff format --check
      - run: uv run --locked --extra worker pytest
