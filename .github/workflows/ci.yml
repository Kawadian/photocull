name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --locked pytest tests/test_api.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked --extra ml
      - run: uv run --locked --extra ml ruff check
      - run: uv run --locked --extra ml ruff format --check
      - run: uv run --locked --extra ml pytest
      - run: uv run --locked --extra ml python scripts/benchmark_catalog.py --assets 2000 --requests 8 --ml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: astral-sh/setup-uv@v7
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
