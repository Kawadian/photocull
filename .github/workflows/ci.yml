name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --locked pytest tests/test_api.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked --extra ml
      - run: uv run --locked --extra ml ruff check
      - run: uv run --locked --extra ml ruff format --check
      - run: uv run --locked --extra ml pytest
      - run: uv run --locked --extra ml python scripts/benchmark_catalog.py --assets 2000 --requests 8 --ml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: astral-sh/setup-uv@v7
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e

  images:
    name: Docker ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/docker/Dockerfile.${{ matrix.image }} -t photocull-${{ matrix.image }}:ci .
      - if: matrix.image == 'api'
        run: >-
          docker run --rm -i --network none --entrypoint python
          photocull-api:ci - < scripts/check_api_image.py
      - if: matrix.image == 'worker'
        run: |
          docker run --rm --network none --entrypoint python photocull-worker:ci -c \
            'import onnxruntime, tokenizers, usearch.index, numkong; from photocull.worker import run; assert "CPUExecutionProvider" in onnxruntime.get_available_providers()'
          docker run --rm --network none --entrypoint ffmpeg photocull-worker:ci -version
