name: CI

on:
  push:
    branches: [main, phase5-archive-convert]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --locked pytest tests/test_api.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl nginx
      - run: sudo scripts/install_dnglab.sh
      - run: uv sync --locked --extra insights
      - run: uv run --locked --extra insights ruff check
      - run: uv run --locked --extra insights ruff format --check
      - run: uv run --locked --extra insights pytest
      - run: uv run --locked --extra insights python -m scripts.benchmark_archive_preview --assets 1000
      - run: uv run --locked --extra insights python -m scripts.benchmark_browser
      - run: uv run --locked --extra insights python scripts/benchmark_catalog.py --assets 2000 --requests 8 --ml --insights

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node e2e/check-bundle.mjs
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e

  images:
    name: Docker ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/docker/Dockerfile.${{ matrix.image }} -t photocull-${{ matrix.image }}:ci .
      - if: matrix.image == 'api'
        run: >-
          docker run --rm -i --network none --entrypoint python
          photocull-api:ci - < scripts/check_api_image.py
      - if: matrix.image == 'worker'
        run: |
          docker run --rm --network none --entrypoint python photocull-worker:ci -c \
            'import onnxruntime, tokenizers, usearch.index, numkong, cv2, faster_whisper, watchdog; from photocull.worker import run; assert "CPUExecutionProvider" in onnxruntime.get_available_providers()'
          docker run --rm --network none --entrypoint ffmpeg photocull-worker:ci -version
          docker run --rm --network none --entrypoint python photocull-worker:ci -c 'import blurhash; from PIL import features; assert features.check("avif") and features.check("webp")'
          docker run --rm --network none \
            -v "$PWD/tests:/archive-ci/tests:ro" \
            -v "$PWD/scripts/benchmark_archive.py:/archive-ci/benchmark_archive.py:ro" \
            --entrypoint python photocull-worker:ci /archive-ci/benchmark_archive.py --smoke
      - if: matrix.image == 'worker'
        name: Check worker egress isolation
        run: |
          docker run --rm --network none -v "$PWD/deploy/egress:/src:ro" \
            -w /src golang:1.26-alpine go test ./...

          fixture="$(mktemp -d)"
          mkdir "$fixture"/{library,state,models}
          export PHOTOCULL_LIBRARY_DIR="$fixture/library"
          export PHOTOCULL_STATE_HOST_DIR="$fixture/state"
          export PHOTOCULL_MODELS_DIR="$fixture/models"
          docker compose config --format json | jq -e \
            '.services.worker.network_mode == "none" and (.services | has("egress-proxy") | not)'

          compose=(docker compose -p egress-ci -f docker-compose.yml -f deploy/compose.egress.yml --profile egress)
          trap '"${compose[@]}" down' EXIT
          export PHOTOCULL_WORKER_NETWORK_MODE=bridge
          "${compose[@]}" config --format json | jq -e '
            .services.worker | .network_mode == null and (.networks | keys == ["worker-egress"])
          '
          docker tag photocull-worker:ci egress-ci-worker
          mkdir -m 0755 "$fixture/state/settings"
          printf '%s\n' '{"overrides":{"network.egress_allow":[]}}' > "$fixture/state/settings/active.json"
          compose+=(-f deploy/compose.settings-egress.yml)
          "${compose[@]}" up -d --build egress-proxy
          "${compose[@]}" run --rm -T --no-deps --entrypoint python worker - <<'PY'
          import http.client
          import os
          import time
          from pathlib import Path
          from urllib.parse import urlsplit

          routes = Path("/proc/net/route").read_text().splitlines()[1:]
          assert routes and all(row.split()[1] != "00000000" for row in routes), routes
          proxy = urlsplit(os.environ["HTTPS_PROXY"])
          connection = http.client.HTTPConnection(proxy.hostname, proxy.port, timeout=2)
          for attempt in range(10):
              try:
                  connection.connect()
                  break
              except ConnectionRefusedError:
                  if attempt == 9:
                      raise
                  time.sleep(0.2)
          for host in ("example.com", "192.168.1.1", "openrouter.ai"):
              connection.request("CONNECT", f"{host}:443")
              with connection.getresponse() as response:
                  assert response.status == 403, response.status
              connection.close()
          PY
